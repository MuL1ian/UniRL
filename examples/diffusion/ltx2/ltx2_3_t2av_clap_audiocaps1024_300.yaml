# @package _global_
# AudioCaps audio training: 150 rollouts x 2 updates = 300 optimizer steps.
# Requires the LTX-2.3 dev checkpoint, cached CLAP weights, and PyAV for audible media.
# 1,024 unique training captions and 128 official validation captions; fixed ODE evaluation.

num_devices: 8
batch_size: 8
adv_use_global_std: false
num_rollouts: 150
load_dir: null
eval_interval: 10
eval_num_prompts: 128
eval_samples_per_prompt: 2
eval_chunk_prompts: 8
eval_eta: 0.0
eval_sampling:
  init_same_noise: false
save_interval: 25
save_dir: ${oc.env:LTX_AUDIO_SAVE_DIR,checkpoints/ltx2_3_clap_ac1024_u300}
save_mode: adapter

logging:
  report_to_wandb: true
  project_name: ${oc.env:WANDB_PROJECT,leo2_traing}
  run_name: ${oc.env:WANDB_RUN_NAME,ltx23-clap-ac1024-e128-u300-n30-cfg3-eta03-sde2-lr1e4-r32a256-g8-f121-bf16}
  entity: ${oc.env:WANDB_ENTITY,boyeniu-the-university-of-sydney}
  tags: [ltx2.3, audio, clap, audiocaps1024, eval128, updates300, cfg3, bf16-master]
  log_media: true
  media_max_items: 8
  media_log_interval: 10

bundle:
  _target_: unirl.models.ltx2.bundle.LTX2Bundle.from_config
  config:
    _target_: unirl.models.ltx2.config.LTX2PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,diffusers/LTX-2.3-Diffusers}
    model_precision: bf16
    autocast_precision: bf16
    trajectory_precision: fp16
    logprob_precision: fp32
    shift: 1.0
    max_sequence_length: 512
    enable_audio: true
    audio_joint_sde: true
    audio_policy_logp_weight: 1.0
    default_height: ${sampling.height}
    default_width: ${sampling.width}
    default_num_frames: ${sampling.num_frames}
    default_frame_rate: 24.0

pipeline:
  _target_: unirl.models.ltx2.pipeline.LTX2Pipeline.from_bundle
  config: ${bundle.config}
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: [LTX2VideoTransformerBlock]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    master_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 300
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 32
    alpha: 256
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - audio_proj_in
      - audio_proj_out
      - audio_attn1.to_q
      - audio_attn1.to_k
      - audio_attn1.to_v
      - audio_attn1.to_out.0
      - audio_attn2.to_q
      - audio_attn2.to_k
      - audio_attn2.to_v
      - audio_attn2.to_out.0
      - video_to_audio_attn.to_q
      - video_to_audio_attn.to_k
      - video_to_audio_attn.to_v
      - video_to_audio_attn.to_out.0
      - audio_ff.net.0.proj
      - audio_ff.net.2

rollout:
  _target_: unirl.rollout.engine.trainside.engine.TrainsideRolloutEngine
  stage_attrs: [diffusion]
  forward_batch_size: 1

reward:
  _target_: unirl.reward.service.RewardService
  backend:
    _target_: unirl.reward.local.clap.CLAPRewardScorer
    base_device: cuda
    config:
      _target_: unirl.reward.local.clap.CLAPSpec
      batch_size: 2
      device: auto
      negative_prompts_metadata_key: negative_audio_captions
      matched_cosine_weight: 1.0
      retrieval_margin_weight: 0.0

algorithm:
  _target_: unirl.algorithms.flowgrpo.FlowGRPO
  stage_attr: diffusion
  clip_range: 5.0e-3
  clip_schedule: constant
  old_logp_source: replay
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.ltx2.conditions.LTX2Conditions
  params: ${sampling}

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0
  num_updates_per_batch: 2

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: data/audiocaps_clap_1024_128_seed42/train.jsonl
      eval_data_path: data/audiocaps_clap_1024_128_seed42/eval.jsonl
      seed: 42
      shuffle: true
    algorithm:
      prompts_per_rollout: ${batch_size}

sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 30
  guidance_scale: 3.0
  height: 512
  width: 768
  num_frames: 121
  eta: 0.3
  samples_per_prompt: 8
  seed: 42
  init_same_noise: true
  autocast_precision: bf16
  trajectory_precision: fp16
  logprob_precision: fp32
  scheduler:
    _target_: unirl.sde.index_schedule.AllSDEScheduler
    num_timesteps: ${..num_inference_steps}
    num_sde_steps: 2
    timestep_fraction: [0.5, 0.9]
